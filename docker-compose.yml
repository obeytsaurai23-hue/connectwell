version: '3.8'
services:
  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: bash -c "pip install -r requirements.txt && uvicorn backend.asgi:application --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/connectwell
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: connectwell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --save 60 1 --loglevel warning

  coturn:
    image: instrumentisto/coturn
    # Note: configure TURN/credentials and ports for production
    ports:
      - "3478:3478"

volumes:
  pgdata:

# Notes:
# - This compose file is for local development only. Replace secrets and images for production.
# - Add an nginx/proxy and TLS termination in production.
