version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: connectwell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  coturn:
    image: instrumentisto/coturn
    ports:
      - "3478:3478"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: bash -c "./entrypoint.sh daphne -b 0.0.0.0 -p 8000 connectwell.asgi:application"

volumes:
  pgdata:
