apiVersion: v1
kind: Secret
metadata:
  name: connectwell-secrets
type: Opaque
stringData:
  # Replace the example values with secure ones in your cluster or use an external secrets manager
  DJANGO_SECRET_KEY: "change-me"
  DATABASE_URL: "postgres://connectwell:password@postgres:5432/connectwell"
  REDIS_URL: "redis://redis:6379/0"
  YOCO_WEBHOOK_SECRET: "yoco-secret"
  TURN_USER: "turnuser"
  TURN_PASS: "turnpass"
