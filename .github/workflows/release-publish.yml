name: Release - package & publish

on:
  push:
    tags:
      - 'v*'

jobs:
  package_and_release:
    name: Package chart and create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      chart_asset_path: ${{ steps.package.outputs.chart_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Package Helm chart
        id: package
        run: |
          mkdir -p out
          helm package charts/connectwell --destination out
          CHART_FILE=$(ls out/*.tgz | head -n 1)
          echo "chart_path=$CHART_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload chart to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.chart_path }}
          asset_name: $(basename ${{ steps.package.outputs.chart_path }})
          asset_content_type: application/gzip

  publish_gh_pages:
    name: Publish chart to gh-pages (optional)
    runs-on: ubuntu-latest
    needs: package_and_release
    if: ${{ secrets.GH_PAGES_PUSH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy chart to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'actions@github.com'

  publish_oci:
    name: Push chart to OCI registry (optional)
    runs-on: ubuntu-latest
    needs: package_and_release
    if: ${{ secrets.OCI_REGISTRY && secrets.OCI_USERNAME && secrets.OCI_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Login to OCI registry
        run: |
          helm registry login ${{ secrets.OCI_REGISTRY }} --username ${{ secrets.OCI_USERNAME }} --password ${{ secrets.OCI_PASSWORD }}

      - name: Push chart to OCI
        run: |
          CHART_FILE=$(ls out/*.tgz | head -n 1)
          helm push "$CHART_FILE" oci://${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_REPOSITORY }} || true

  publish_backup_image:
    name: Build & push backup image (optional)
    runs-on: ubuntu-latest
    needs: package_and_release
    if: ${{ secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          registry: ${{ secrets.REGISTRY_HOST || 'docker.io' }}

      - name: Build and push backup-job image
        uses: docker/build-push-action@v4
        with:
          context: ./images/backup-job
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST || 'docker.io' }}/${{ secrets.REGISTRY_NAMESPACE || github.repository_owner }}/connectwell-backup:${{ github.ref_name }}
