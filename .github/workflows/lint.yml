name: Lint & Typecheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: |
          # limit to backend package to keep run fast
          flake8 backend || (echo 'flake8 failed' && exit 1)

      - name: Run mypy
        run: |
          # ignore missing imports for third-party libs in CI
          mypy backend --ignore-missing-imports || (echo 'mypy failed' && exit 1)
