version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connectwell}
      POSTGRES_USER: ${POSTGRES_USER:-connectwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectwell}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - connectnet

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - connectnet

  coturn:
    image: instrumentisto/coturn
    restart: unless-stopped
    environment:
      - TURN_SECRET=${TURN_SECRET:-}
    ports:
      - "3478:3478"
    networks:
      - connectnet

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TURN_URL=turn:coturn:3478
      - TURN_USER=${TURN_USER:-}
      - TURN_PASS=${TURN_PASS:-}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - connectnet

volumes:
  db_data:

networks:
  connectnet:
    driver: bridge
